# ╔══════════════════════════════════════════════════════════════════╗
# ║  AgroTécnico — Nginx (proxy reverso + HTTPS)                     ║
# ║                                                                    ║
# ║  O server.js roda na porta 3000 (interna, não exposta à           ║
# ║  internet). O Nginx recebe as requisições em 80/443 e repassa     ║
# ║  para o Node — permite HTTPS gratuito via Let's Encrypt sem       ║
# ║  tocar no código do server.js.                                    ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# INSTALAÇÃO (Ubuntu/Debian, VPS Hostinger):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo mkdir -p /var/www/agrotecnico/public
#   sudo cp agrotecnico-final.html /var/www/agrotecnico/public/index.html
#     ↳ o scripts/deploy.sh já faz essa cópia automaticamente a cada deploy
#   sudo cp nginx-agrotecnico.conf /etc/nginx/sites-available/agrotecnico
#   sudo ln -s /etc/nginx/sites-available/agrotecnico /etc/nginx/sites-enabled/
#   sudo nginx -t                        # valida a config antes de aplicar
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d agrotecnico.com.br -d www.agrotecnico.com.br
#     ↳ o certbot edita este arquivo automaticamente para adicionar o
#       bloco SSL — rode o comando acima DEPOIS de ativar o site.
#
# ARQUITETURA:
#   O server.js é uma API pura — nunca serve o HTML do site (verificado
#   no código: não há nenhum express.static() nem rota servindo
#   agrotecnico-final.html). O Nginx é quem serve o arquivo estático
#   diretamente do disco (mais rápido, sem round-trip pelo Node) e só
#   encaminha ao Node as rotas que são de fato dinâmicas: /api/*,
#   /health, /robots.txt, /sitemap.xml e /tecnicos/:uf (página SSR).

server {
    listen 80;
    listen [::]:80;
    server_name agrotecnico.com.br www.agrotecnico.com.br;

    root /var/www/agrotecnico/public;
    index index.html;

    # Necessário para o certbot validar o domínio antes de emitir o certificado
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Após o certbot rodar, ele redireciona automaticamente o resto
    # deste bloco para HTTPS — nada a fazer manualmente aqui.

    # ── Rotas dinâmicas → Node ──────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
    }

    # Página SSR por estado (/tecnicos/mt, /tecnicos/ro...) — não existe
    # pasta "tecnicos" nos arquivos estáticos, então não há colisão.
    location /tecnicos/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── Site estático (tudo o mais) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Limita o tamanho de upload — alinhado com o limite de 5MB do
    # multer no server.js (upload de documento do técnico).
    client_max_body_size 6M;
}

